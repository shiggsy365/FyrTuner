apply plugin: 'com.android.application'

// Release signing: keystore.properties next to settings.gradle (storeFile, keyAlias,
// storePassword), never committed. Without it, release builds use the debug key.
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'com.example.android.sampletvinput'

    defaultConfig {
        compileSdkVersion 35
        applicationId "com.example.android.sampletvinput"
        minSdkVersion 22
        targetSdkVersion 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        if (signingProps.getProperty('storeFile')) {
            release {
                storeFile file(signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('storePassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}

dependencies {
    implementation 'androidx.leanback:leanback:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.amazon.android:exoplayer:2.18.2'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
